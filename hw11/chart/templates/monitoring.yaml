{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-prometheus
rules:
  - apiGroups: ['']
    resources: [nodes, nodes/proxy, pods, services, endpoints]
    verbs: [get, list, watch]
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-prometheus
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-prometheus
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-prometheus
data:
  prometheus.yml: |
{{ tpl (.Files.Get "files/prometheus.yml") . | indent 4 }}
  alerts.yml: |
{{ tpl (.Files.Get "files/alerts.yml") . | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}-prometheus
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-prometheus
      annotations:
        checksum/config: {{ printf "%s%s%s" (.Files.Get "files/prometheus.yml") (.Files.Get "files/alerts.yml") (.Values.monitoring | toJson) | sha256sum }}
    spec:
      serviceAccountName: {{ .Release.Name }}-prometheus
      securityContext:
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: {{ .Values.monitoring.prometheusImage }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.monitoring.retentionTime }}
            - --storage.tsdb.retention.size={{ .Values.monitoring.retentionSize }}
            - --storage.tsdb.min-block-duration=10m
            - --storage.tsdb.max-block-duration=10m
            - --web.enable-lifecycle
            - --query.max-concurrency=4
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 300m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 3
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: {{ .Release.Name }}-prometheus}
        - name: data
          emptyDir: {sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-prometheus
spec:
  selector: {app: {{ .Release.Name }}-prometheus}
  ports:
    - {name: http, port: 9090, targetPort: http}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-kube-state-metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-kube-state-metrics
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-kube-state-metrics
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels: {app: {{ .Release.Name }}-kube-state-metrics}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-kube-state-metrics}
    spec:
      serviceAccountName: {{ .Release.Name }}-kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: {{ .Values.monitoring.kubeStateMetricsImage }}
          args:
            - --resources=pods,deployments,horizontalpodautoscalers
            - --namespaces={{ .Release.Namespace }}
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-kube-state-metrics
spec:
  selector: {app: {{ .Release.Name }}-kube-state-metrics}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-grafana
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://{{ .Release.Name }}-prometheus:9090
        isDefault: true
        editable: false
  dashboard-provider.yml: |
    apiVersion: 1
    providers:
      - name: hw11
        options:
          path: /var/lib/grafana/dashboards
  dashboard.json: |
{{ .Files.Get "files/dashboard.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: {{ .Release.Name }}-grafana}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-grafana}
      annotations:
        checksum/dashboard: {{ .Files.Get "files/dashboard.json" | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: {{ .Values.monitoring.grafanaImage }}
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: 'true'}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: 'true'}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: 'false'}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: 'false'}
          ports:
            - {name: http, containerPort: 3000}
          resources:
            requests: {cpu: 25m, memory: 96Mi}
            limits: {cpu: 200m, memory: 192Mi}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: config, mountPath: /etc/grafana/provisioning/datasources/datasource.yml, subPath: datasource.yml}
            - {name: config, mountPath: /etc/grafana/provisioning/dashboards/provider.yml, subPath: dashboard-provider.yml}
            - {name: config, mountPath: /var/lib/grafana/dashboards/dashboard.json, subPath: dashboard.json}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 128Mi}
        - name: config
          configMap: {name: {{ .Release.Name }}-grafana}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-grafana
spec:
  selector: {app: {{ .Release.Name }}-grafana}
  ports:
    - {name: http, port: 3000, targetPort: http}
{{- end }}
