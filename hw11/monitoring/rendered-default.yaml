apiVersion: apps/v1
kind: Deployment
metadata:
  name: hw11-prometheus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hw11-prometheus
  template:
    metadata:
      labels:
        app: hw11-prometheus
      annotations:
        checksum/config: 7bbcd4384e629b6f909a78204c4be9d7e0edd798d9cdcf757c16773fba844027
    spec:
      serviceAccountName: hw11-prometheus
      securityContext:
        runAsUser: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=1h
            - --storage.tsdb.retention.size=128MB
            - --storage.tsdb.min-block-duration=10m
            - --storage.tsdb.max-block-duration=10m
            - --web.enable-lifecycle
            - --query.max-concurrency=4
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 300m, memory: 256Mi}
          readinessProbe:
            httpGet: {path: /-/ready, port: http}
            periodSeconds: 3
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
            - {name: data, mountPath: /prometheus}
      volumes:
        - name: config
          configMap: {name: hw11-prometheus}
        - name: data
          emptyDir: {sizeLimit: 256Mi}
