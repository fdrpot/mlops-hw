apiVersion: apps/v1
kind: Deployment
metadata:
  name: hw11-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  minReadySeconds: 2
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: hw11-api
  template:
    metadata:
      labels:
        app: hw11-api
        app.kubernetes.io/component: api
        app.kubernetes.io/instance: hw11
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        checksum/config: 5262ccae028a1f56e9c0ee615ab9da2dbfc89dfae668eed4c98d1cdbcaa98f61
    spec:
      terminationGracePeriodSeconds: 60
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: "hw11-api:local"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: hw11-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            limits:
              cpu: 500m
              memory: 192Mi
            requests:
              cpu: 100m
              memory: 64Mi
          startupProbe:
            httpGet:
              path: /startup
              port: http
            periodSeconds: 1
            timeoutSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 1
            timeoutSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command:
                  - python
                  - -c
                  - "import urllib.request,time; time.sleep(3); urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/drain',method='POST'),timeout=0.5); time.sleep(1)"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: artifact
              mountPath: /artifacts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: artifact
          configMap:
            name: hw11-model-a
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
