kind: Deployment
metadata:
  name: hw11-kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels: {app: hw11-kube-state-metrics}
  template:
    metadata:
      labels: {app: hw11-kube-state-metrics}
    spec:
      serviceAccountName: hw11-kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.16.0
          args:
            - --resources=pods,deployments,horizontalpodautoscalers
            - --namespaces=hw11
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {cpu: 100m, memory: 64Mi}
---
# Source: hw11/templates/monitoring.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hw11-grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: hw11-grafana}
  template:
    metadata:
      labels: {app: hw11-grafana}
      annotations:
        checksum/dashboard: 094b162ce9f32f07e6946d2acfa7ed9d34a65a4e0f9204e627151b0dbb4cbc9a
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:12.1.0
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: 'true'}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_AUTH_DISABLE_LOGIN_FORM, value: 'true'}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: 'false'}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: 'false'}
          ports:
            - {name: http, containerPort: 3000}
          resources:
            requests: {cpu: 25m, memory: 96Mi}
            limits: {cpu: 200m, memory: 192Mi}
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: config, mountPath: /etc/grafana/provisioning/datasources/datasource.yml, subPath: datasource.yml}
            - {name: config, mountPath: /etc/grafana/provisioning/dashboards/provider.yml, subPath: dashboard-provider.yml}
            - {name: config, mountPath: /var/lib/grafana/dashboards/dashboard.json, subPath: dashboard.json}
      volumes:
        - name: data
          emptyDir: {sizeLimit: 128Mi}
        - name: config
          configMap: {name: hw11-grafana}
