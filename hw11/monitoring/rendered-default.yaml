# Source: hw11/templates/monitoring.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: hw11-prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
      scrape_timeout: 4s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: hw11-api
        honor_labels: true
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: ['hw11']
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: 'hw11-api'
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: http
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
      - job_name: kube-state-metrics
        static_configs:
          - targets: ['hw11-kube-state-metrics:8080']
      - job_name: kubelet-cadvisor
        scheme: https
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
        metric_relabel_configs:
          - source_labels: [namespace]
            regex: 'hw11'
            action: keep
          - source_labels: [__name__]
            regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes
            action: keep

  alerts.yml: |
    groups:
      - name: hw11-service
        interval: 5s
        rules:
          - alert: HW11HighTTFC
            expr: >-
              (histogram_quantile(0.95, sum by (le) (rate(hw11_ttfc_seconds_bucket[30s]))) > 0.6)
              and (sum(increase(hw11_ttfc_seconds_count[30s])) >= 10)
            for: 10s
            labels:
              severity: warning
            annotations:
              summary: "Simulator p95 TTFC exceeds threshold with enough observations"
          - alert: HW11HighRejectionRatio
            expr: >-
              ((sum(rate(hw11_requests_total{outcome="rejected"}[30s])) / clamp_min(sum(rate(hw11_requests_total[30s])), 0.001)) > 0.1)
              and (sum(increase(hw11_requests_total[30s])) >= 10)
            for: 10s
            labels:
              severity: warning
            annotations:
              summary: "Rejection ratio exceeds threshold with enough observations"
---
