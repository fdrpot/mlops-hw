# Единственная точка конфигурации ДЗ 3.

collect:
  version: "v1"
  dataset:
    name: "carosh/cli-1m"
    revision: "ec725c1269166e7f8ce8a20df1787ceecd1e421a"
    url: "https://huggingface.co/datasets/carosh/cli-1m"
  sources:
    v1:
      - "sources/cli1m"
    v2:
      - "sources/cli1m"
  language: "en"
  shell: "bash"
  licenses:
    - "Apache-2.0"
    - "MIT"
    - "CC-BY-4.0"
    - "MPL-2.0"
  max_per_topic: 20
  versions:
    v1:
      buckets: ["data_ml", "cloud", "devops", "database", "systems"]
    v2:
      buckets: ["data_ml", "cloud", "devops", "database", "systems", "network", "security", "web_api", "modern_unix", "lang_tool"]
  system_prompts:
    - "Return one Bash command for the infrastructure task."
    - "Act as a DevOps CLI assistant; output only the command."
    - "Translate this operational request into one Bash command."
    - "Provide the requested shell command without explanation."
    - "Answer the MLOps task with only a Bash command."

clean:
  min_user_chars: 10
  max_user_chars: 1000
  min_assistant_chars: 2
  near_dup:
    enabled: true
    shingle_words: 4
    num_perm: 64
    threshold: 0.85
  pii:
    enabled: true

diversity:
  min_examples: 1000
  min_system_prompts: 3
  min_groups: 50
  max_group_share: 0.10
  min_answer_len_ratio: 1.6
  max_same_length_share: 0.25
  max_duplicate_answer_share: 0.30

split:
  group_key: "topic"
  ratios:
    train: 0.8
    val: 0.1
    test: 0.1
  seed: 42

contamination:
  threshold: 0.85

paths:
  raw: "data/raw.jsonl"
  clean: "data/clean.jsonl"
  train: "data/train.jsonl"
  val: "data/val.jsonl"
  test: "data/test.jsonl"
  metrics_collect: "metrics/collect.json"
  metrics_clean: "metrics/clean.json"
  metrics_split: "metrics/split.json"
  metrics_diversity: "metrics/diversity.json"
  metrics_contamination: "metrics/contamination.json"
  datasheet: "docs/datasheet.md"
